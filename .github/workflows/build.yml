name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          $ANDROID_NDK_LATEST_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/src/Android.mk \
            NDK_APPLICATION_MK=jni/src/Application.mk

      - name: Upload menu binary
        uses: actions/upload-artifact@v4
        with:
          name: menu-binary
          path: libs/arm64-v8a/libmenu.so